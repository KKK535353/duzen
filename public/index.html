<script>
(function(){try{var c=JSON.parse(localStorage.getItem('duzen:theme')||'null');if(!c)return;var m=c.mode,d=false;
if(m==='dark')d=true;else if(m==='system')d=!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
else if(m==='auto'){var n=new Date(),cur=n.getHours()*60+n.getMinutes(),p=function(s){var a=String(s||'').split(':');return (+a[0]||0)*60+(+a[1]||0)},f=p(c.from||'20:00'),u=p(c.to||'07:00');d=f===u?false:(f<u?(cur>=f&&cur<u):(cur>=f||cur<u));}
if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
<title>Düzen: İlaç ve Döngü</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#1F1B33;--ink2:#5E5A74;--line:#E4E0EE;--paper:#F6F4FA;--surf:#fff;
--teal:#0F7F7E;--teal-soft:#DDF1F0;--berry:#BA2F5C;--berry-soft:#F9DCE6;--violet:#6552CF;--violet-soft:#E6E1FA;--ok:#2F9E5F;--bad:#D2433D;--warn:#B4561B;--warn-soft:#FBE9DC;
--field:#fff;--btn:#1F1B33;--btn-ink:#fff;--teal-t:#0D7473;--berry-t:#BA2F5C;--violet-t:#6552CF;--warn-ink:#7A3A0F;--danger:#B3261E;--danger-line:#E7B9B5;--fert:#B9AEF0;--overlay:rgba(31,27,51,.45);color-scheme:light}
html[data-theme="dark"]{color-scheme:dark;--ink:#ECE9F7;--ink2:#A9A4BF;--line:#34304A;--paper:#121019;--surf:#1C1A28;--field:#26233A;--btn:#ECE9F7;--btn-ink:#121019;--teal:#188280;--teal-t:#4FD1CE;--teal-soft:#17373A;--berry:#C23C6B;--berry-t:#FF86AA;--berry-soft:#3A1B2B;--violet:#6F5CD9;--violet-t:#AB9EFF;--violet-soft:#29244D;--ok:#4CC083;--bad:#F0706A;--warn:#E58A4B;--warn-soft:#3A2616;--warn-ink:#F2B98A;--danger:#FF8F87;--danger-line:#5A2A2A;--fert:#5E50B3;--overlay:rgba(0,0,0,.6)}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--paper)}
main{flex:1;overflow-y:auto;padding:max(22px,env(safe-area-inset-top)) 20px 28px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--surf);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 8px;border:0;background:none;color:var(--ink2);font-size:12px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--c)}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:750;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700;color:var(--ink2);margin:26px 0 8px}
.sub{color:var(--ink2);font-size:15px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:var(--btn);color:var(--btn-ink)}
.btn.teal{background:var(--teal);color:#fff} .btn.berry{background:var(--berry);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--danger-line);color:var(--danger)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.block{width:100%}
.btn:active{transform:scale(.97)}

.ring-row{display:flex;align-items:center;gap:18px;padding:6px 0 4px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--teal-soft)} .ring .fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{font-size:20px;font-weight:800;fill:var(--ink);text-anchor:middle}
.ring-row b{font-size:19px;display:block}

.doses{list-style:none;margin-top:6px}
.dose{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.dose .dt{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.dose .di b{display:block;font-weight:700}
.dose .di span{font-size:14px;color:var(--ink2)}
.dose.late .dt,.dose.late .di span{color:var(--warn)}
.dose.taken .di b,.dose.skipped .di b{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1.5px}
.acts{display:flex;gap:6px}
.chip-btn{border:0;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;background:var(--teal-soft);color:var(--teal-t)}
.dose.skipped .chip-btn{background:var(--line);color:var(--ink2)}
.note{background:var(--warn-soft);color:var(--warn-ink);border-radius:14px;padding:11px 14px;font-size:14.5px;margin-top:12px}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:20px;text-align:center;margin-top:10px}
.empty p{color:var(--ink2);margin:6px 0 14px}

.cyc-head{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--berry-t)}
.strip{display:flex;gap:2px;align-items:center;height:34px;margin:14px 0 8px}
.seg{flex:1;height:12px;border-radius:4px;background:var(--line)}
.seg.p{background:var(--berry)} .seg.f{background:var(--fert)} .seg.o{background:var(--violet)}
.seg.now{height:30px;border-radius:6px;outline:2.5px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.prompt{background:var(--berry-soft);border-radius:16px;padding:14px;margin-top:14px}
.prompt p{margin-bottom:10px;font-weight:600}
.prompt .row{display:flex;gap:8px}

.bars{display:flex;gap:8px;align-items:flex-end;height:96px;margin:10px 0 4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--ink2)}
.bar i{width:100%;border-radius:8px;background:var(--teal);min-height:6px}
.bar i.none{background:transparent;border:1.5px dashed var(--line);height:6px!important}
.med{display:block;width:100%;text-align:left;background:var(--surf);border:0;border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 0 var(--line)}
.med b{font-size:17px}
.med .meta{color:var(--ink2);font-size:14px;margin-top:2px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tchips span{background:var(--teal-soft);color:var(--teal-t);font-weight:750;border-radius:999px;padding:3px 11px;font-size:14px;font-variant-numeric:tabular-nums}

.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.monthbar button.ic{border:0;background:var(--surf);border-radius:50%;width:40px;height:40px;font-size:20px;font-weight:700}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{text-align:center;font-size:12.5px;font-weight:700;color:var(--ink2);padding-bottom:4px}
.cell{aspect-ratio:1;border:0;border-radius:50%;background:transparent;font-weight:650;display:flex;align-items:center;justify-content:center;position:relative}
.cell.period{background:var(--berry);color:#fff}
.cell.pred{border:2px dashed var(--berry);color:var(--berry-t)}
.cell.fert{background:var(--violet-soft);color:var(--violet-t)}
.cell.ov{background:var(--violet);color:#fff}
.cell.today span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.cell.sel{box-shadow:0 0 0 2.5px var(--ink)}
.cell u{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.8}
.stats{display:flex;gap:18px;margin:16px 0 4px}
.stats div{flex:1} .stats b{display:block;font-size:18px} .stats span{font-size:13px;color:var(--ink2)}
.panel{background:var(--surf);border-radius:20px;padding:16px;margin-top:16px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--berry)} .sw.on::after{transform:translateX(20px)}
.sw.t.on{background:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:650}
.chip.on{background:var(--berry);border-color:var(--berry);color:#fff}
.chip.v.on{background:var(--violet);border-color:var(--violet)}
.fine{font-size:13px;color:var(--ink2);margin-top:14px}

label{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin-top:14px}
.lbl{font-size:14px;font-weight:700;color:var(--ink2);margin-top:16px;margin-bottom:6px}
input,textarea{width:100%;display:block;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);font-size:16px;color:var(--ink);font-weight:500}
textarea{resize:none;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.trow input{margin:0}
.x{border:0;background:var(--line);width:42px;height:42px;border-radius:12px;font-size:18px;flex:none}
.days{display:flex;gap:6px}
.dchip{flex:1;border:1.5px solid var(--line);background:var(--field);border-radius:12px;padding:10px 0;font-weight:700;font-size:13px}
.dchip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.actions{display:flex;gap:10px;margin-top:22px}
.actions .btn{flex:1}
.step{display:flex;align-items:center;gap:14px}
.step button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--field);font-size:20px;font-weight:700}
.step b{min-width:54px;text-align:center}
.set{padding:14px 0;border-bottom:1px solid var(--line)}
.set small{display:block;color:var(--ink2);font-size:13.5px;margin-top:2px}
input[type=file]{display:none}

#sheetwrap,#alert{position:fixed;inset:0;background:var(--overlay);display:none;z-index:20}
#sheetwrap.open{display:flex;align-items:flex-end;justify-content:center}
#alert.open{display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--surf);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;animation:up .22s ease-out}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.abox{background:var(--surf);border-radius:26px;padding:26px 22px 22px;width:100%;max-width:380px;text-align:center;animation:up .22s ease-out}
.abox .big{font-size:52px;font-weight:800;letter-spacing:-.03em;color:var(--teal-t);font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.abox .actions{flex-direction:column}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
.thread{max-height:38dvh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:14px 0 4px;padding:2px}
.msg{max-width:86%;padding:9px 12px;border-radius:16px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--teal-soft)}
.msg.a{align-self:flex-start;background:var(--surf);border:1.5px solid var(--line)}
.msg small{display:block;color:var(--ink2);font-size:12px;margin-top:3px}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--berry);color:#fff;font-size:12px;font-weight:800;margin-left:6px}
.course{display:flex;align-items:center;gap:12px;margin-top:12px}
.course b{display:block;font-size:15px}
.course .sub{margin:0;font-size:13px}
.mring{width:48px;height:48px;flex:none}
.mring circle{fill:none;stroke-width:6}
.mring .bg{stroke:var(--bad)}
.mring .fg{stroke:var(--ok);stroke-linecap:round}
.mring.done .bg{stroke:var(--ok)} .mring.soon .bg{stroke:var(--line)}
.clg{display:flex;flex-direction:column;gap:1px;font-size:14px}
.clg .ok{color:var(--ok);font-weight:700}
.clg .bad{color:var(--bad);font-weight:700}
.mring text{font-size:12px;font-weight:800;fill:var(--ink);text-anchor:middle}
.appt{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surf);border:0;border-radius:18px;padding:10px 14px 10px 10px;margin-bottom:8px;box-shadow:0 1px 0 var(--line);color:inherit}
.appt.past{opacity:.6}
.adays{text-align:center;background:var(--violet-soft);border-radius:12px;padding:7px 2px}
.adays b{display:block;font-size:22px;line-height:1.1;color:var(--ink)}
.adays span{font-size:11px;color:var(--ink2)}
.ainfo b{display:block}
.ainfo span{display:block;color:var(--ink2);font-size:14px}
.ainfo .arem{font-size:12.5px}
.apptbig{display:flex;gap:14px;align-items:center;background:var(--violet-soft);border-radius:18px;padding:14px 16px;margin-bottom:6px}
.apptbig .abn{font-size:40px;font-weight:800;line-height:1;min-width:72px;text-align:center}
.apptbig b{display:block}
.apptbig span{display:block;font-size:14px;color:var(--ink2)}
.wxcard{background:var(--surf);border-radius:16px;padding:10px 12px 8px;margin:0 0 14px;box-shadow:0 1px 0 var(--line)}
.wxtop{display:flex;gap:10px;align-items:center}
.wxbig{font-size:30px;line-height:1}
.wxtop b{display:block;font-size:15px}
.wxtop span{font-size:13px;color:var(--ink2)}
.wxrow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.wxd{padding:4px 0;text-align:center;border-radius:10px;display:flex;flex-direction:column;align-items:center;background:transparent;border:0;color:inherit;font:inherit;cursor:pointer}
.wxd b{font-size:12px;color:var(--ink2)}
.wxd small{font-size:10.5px;color:var(--ink2);line-height:1.1}
.wxd .wxi{font-size:20px;line-height:1.3}
.wxd .wxh{font-size:13px;font-weight:800}
.wxd.today{background:var(--teal-soft)}
.wxd.sel{outline:2px solid var(--violet)}
.wxdet{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--violet-soft);font-size:13.5px}
.wxfoot{font-size:11.5px;color:var(--ink2);margin-top:5px}
.inbox{background:var(--violet-soft);border-radius:16px;padding:10px 12px 6px;margin:0 0 14px}
.ibh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ibh b{font-size:15px}
.ibi{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:7px 0;color:inherit}
.ibt{font-size:12px;color:var(--ink2);min-width:40px;padding-top:2px}
.ibi b{display:block;font-size:14px}
.ibi span:not(.ibt){font-size:13px;color:var(--ink2);display:block}
.bell{position:relative;flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);box-shadow:0 1px 0 var(--line);display:flex;align-items:center;justify-content:center}
.bell svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell i{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--berry);color:#fff;font:700 11px/19px system-ui,sans-serif;font-style:normal;text-align:center;padding:0 5px}
.hd{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 4px}
.hi{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:9px 6px;color:inherit;border-radius:8px}
.hi.new{background:var(--violet-soft)}
.hi .ht{font-size:13px;color:var(--ink2);min-width:42px;padding-top:2px;font-variant-numeric:tabular-nums}
.hi b{display:block;font-size:14.5px}
.hi span:not(.ht){display:block;font-size:13.5px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="sheetwrap"><div class="sheet" id="sheet"></div></div>
<div id="alert"></div>
<div id="toast" role="status"></div>

<script>
/* ---------- yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const today=()=>fmt(new Date());
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const tmin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function themeDark(cfg){
  const m=cfg.mode||'light';
  if(m==='dark') return true; if(m==='light') return false;
  if(m==='system') return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const n=new Date(),cur=n.getHours()*60+n.getMinutes(),f=tmin(cfg.from||'20:00'),u=tmin(cfg.to||'07:00');
  return f===u?false:(f<u?(cur>=f&&cur<u):(cur>=f||cur<u));
}
function applyTheme(){
  const s=S.settings,cfg={mode:s.theme||'light',from:s.themeFrom||'20:00',to:s.themeTo||'07:00'}, dark=themeDark(cfg), root=document.documentElement;
  if(dark) root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
  const mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.setAttribute('content',dark?'#121019':'#F6F4FA');
  try{localStorage.setItem('duzen:theme',JSON.stringify(cfg));}catch(e){}
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNLER=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const GUN_UZUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const short=s=>{const d=parse(s);return `${d.getDate()} ${AYLAR[d.getMonth()]}`};
const long=s=>{const d=parse(s);return `${GUN_UZUN[d.getDay()]}, ${d.getDate()} ${AYLAR[d.getMonth()]}`};
const SYM=['Kramp','Baş ağrısı','Şişkinlik','Yorgunluk','Hassasiyet','Sivilce','Huzursuzluk','Mutlu','Düşük enerji'];
const FLOW=['Hafif','Orta','Yoğun'];
const REM_PRESETS=[
 {label:'Sabah suyu',time:'07:00',text:'Günaydın! İlacını bol suyla içmeyi unutma.'},
 {label:'Öğle suyu',time:'13:00',text:'Su içmeyi unutma.'},
 {label:'Hareket',time:'16:00',text:'Kalk, biraz hareket et ve su iç.'},
 {label:'Akşam kontrolü',time:'21:30',text:'Bugünkü ilaçlarını işaretledin mi?'}
];
const ICON={

/* ---------- ilaç mantığı ---------- */
function medActive(m,d){
  if(d<m.start) return false; if(m.end&&d>m.end) return false;
  return m.days.includes((parse(d).getDay()+6)%7);
}
function slotsFor(d){
  const out=[];
  S.meds.forEach(m=>{ if(medActive(m,d)) m.times.forEach(t=>out.push({m,t,key:m.id+'|'+t})); });
  return out.sort((a,b)=>tmin(a.t)-tmin(b.t)||a.m.name.localeCompare(b.m.name,'tr'));
}
const getLog=(d,k)=>(S.log[d]||{})[k];
function setLog(d,k,val,m){
  const prev=getLog(d,k); S.log[d]=S.log[d]||{};
  if(val) S.log[d][k]=val; else delete S.log[d][k];
  if(m&&m.stock!=null){
    if(val==='taken'&&prev!=='taken') m.stock=Math.max(0,m.stock-1);
    else if(prev==='taken'&&val!=='taken') m.stock+=1;
  }
  persist();
}
function adherence(){
  const t=today(),nm=nowMin(),out=[];
  for(let i=6;i>=0;i--){
    const d=addDays(t,-i);
    const sl=slotsFor(d).filter(s=>d<t||tmin(s.t)<=nm||getLog(d,s.key));
    const taken=sl.filter(s=>getLog(d,s.key)==='taken').length;
    out.push({d,exp:sl.length,taken});
  }
  return out;
}

/* ---------- döngü mantığı ---------- */
function runs(){
  const days=Object.keys(S.periodDays).filter(d=>S.periodDays[d]).sort(), r=[];
  days.forEach(d=>{const l=r[r.length-1]; if(l&&diff(d,l.end)===1) l.end=d; else r.push({start:d,end:d});});
  return r;
}
function cycleInfo(){
  const R=runs(),st=S.settings; let avg=st.cycleLen,n=0;
  if(R.length>=2){
    const starts=R.slice(-7).map(x=>x.start),gaps=[];
    for(let i=1;i<starts.length;i++){const g=diff(starts[i],starts[i-1]); if(g>=15&&g<=60) gaps.push(g);}
    if(gaps.length){n=gaps.length; if(st.auto) avg=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);}
  }
  return {runs:R,last:R[R.length-1]||null,avg,n};
}
function predict(){
  const c=cycleInfo(); if(!c.last) return null;
  const list=[];
  for(let k=1;k<=8;k++){const s=addDays(c.last.start,c.avg*k); list.push({start:s,ov:addDays(s,-14),fs:addDays(s,-19),fe:addDays(s,-13)});}
  return {c,list};
}
function dayType(d,P,t){
  if(S.periodDays[d]) return 'period';
  if(!P) return '';
  for(const p of P.list){
    if(d>=t&&d>=p.start&&d<=addDays(p.start,S.settings.periodLen-1)) return 'pred';
    if(d===p.ov) return 'ov';
    if(d>=p.fs&&d<=p.fe) return 'fert';
  }
  return '';
}
function phase(t,P){
  if(S.periodDays[t]) return 'Regl dönemi';
  const p=P.list[0];
  if(t===p.ov) return 'Tahmini yumurtlama günü';
  if(t>=p.fs&&t<=p.fe) return 'Tahmini verimli dönem';
  if(t<p.fs) return 'Foliküler evre';
  return 'Luteal evre';
}
function startPeriod(date){
  const t=today(),end=addDays(date,S.settings.periodLen-1);
  let d=date; while(d<=end&&d<=t){S.periodDays[d]=true;d=addDays(d,1);}
  persist();
}
function strip(c,day){
  const L=c.avg,ovI=L-14; let h='';
  for(let i=0;i<L;i++){
    let cls='seg';
    if(i<S.settings.periodLen) cls+=' p'; else if(i===ovI) cls+=' o'; else if(i>=ovI-5&&i<=ovI+1) cls+=' f';
    if(i===Math.max(0,Math.min(day-1,L-1))) cls+=' now';
    h+=`<i class="${cls}"></i>`;
  }
  return `<div class="strip" role="img" aria-label="Döngü çizelgesi">${h}</div>
  <div class="legend"><span><i style="background:var(--berry)"></i>Regl</span><span><i style="background:var(--fert)"></i>Verimli dönem</span><span><i style="background:var(--violet)"></i>Yumurtlama</span></div>`;
}

function greeting(){
  const h=new Date().getHours();
  const g=h<5?'İyi geceler':h<12?'Günaydın':h<18?'İyi günler':h<22?'İyi akşamlar':'İyi geceler';
  return S.settings.name?`${g}, ${esc(S.settings.name)}`:g;
}
function nextDose(){
  const t=today(),nm=nowMin();
  for(let i=0;i<=7;i++){
    const d=addDays(t,i);
    for(const s of slotsFor(d)){
      if(i===0&&(getLog(d,s.key)||tmin(s.t)<nm)) continue;
      return {s,date:d,mins:i*1440+tmin(s.t)-nm};
    }
  }
  return null;
}

  return `<div class="head"><div><h1>${greeting()}</h1><div class="sub">${long(t)}</div></div><button class="bell" data-a="inboxHist" aria-label="Bildirimler${inboxList.length?`, ${inboxList.length} yeni`:''}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.5-2V10a4.5 4.5 0 0 0-9 0v5z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>${inboxList.length?`<i>${inboxList.length>9?'9+':inboxList.length}</i>`:''}</button></div>

/* ---------- hatırlatma motoru ---------- */
let ac;
function beep(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    [0,.35].forEach(o=>{
      const osc=ac.createOscillator(),g=ac.createGain(); osc.connect(g); g.connect(ac.destination); osc.frequency.value=880;
      const t0=ac.currentTime+o; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.25,t0+.03); g.gain.exponentialRampToValueAtTime(.0001,t0+.3);
      osc.start(t0); osc.stop(t0+.32);
    });
  }catch(e){}
}
function notify(s){
  if(S.settings.sound){beep(); if(navigator.vibrate) navigator.vibrate([200,100,200]);}
  if(S.settings.notif&&!S.settings.push&&'Notification' in window&&Notification.permission==='granted'){
    try{ new Notification('İlaç vakti: '+s.m.name,{body:s.m.dose||'Dozunu almayı unutma',tag:s.key}); }catch(e){}
  }
}
function showAlert(s,quiet){

  <h2>${esc(s.m.name)}</h2><p class="sub">${esc(s.m.dose||'')}${s.m.note?(s.m.dose?'. ':'')+esc(s.m.note):''}</p>
  <div class="actions"><button class="btn teal" data-a="aTake">Aldım</button><button class="btn ghost" data-a="aSnooze">10 dakika sonra hatırlat</button><button class="btn ghost" data-a="aSkip">Atla</button></div></div>`;
  $('#alert').classList.add('open'); if(!quiet) notify(s);
}
function closeAlert(){ $('#alert').classList.remove('open'); alertOpen=null; render(); if(pendingInfo){ const p=pendingInfo; pendingInfo=null; showInfo(p.title,p.body); } }
function tick(){
  if(S.settings.theme==='auto'||S.settings.theme==='system') applyTheme();
  if(wxNeed()) pushSync();
  const t=today(),nm=nowMin();
  if(!alertOpen){
    const due=slotsFor(t).find(s=>!getLog(t,s.key)&&tmin(s.t)<=nm&&nm-tmin(s.t)<=90&&!fired[t+s.key]&&!(snooze[s.key]>Date.now()));

function download(name,text,type){

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);

function makeICS(){
  const D=['MO','TU','WE','TH','FR','SA','SU'],n=new Date(),
  stamp=`${n.getUTCFullYear()}${pad(n.getUTCMonth()+1)}${pad(n.getUTCDate())}T${pad(n.getUTCHours())}${pad(n.getUTCMinutes())}00Z`;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Duzen//TR//EN','CALSCALE:GREGORIAN'];
  S.meds.forEach(m=>m.times.forEach(t=>{
    let rr=m.days.length===7?'FREQ=DAILY':'FREQ=WEEKLY;BYDAY='+m.days.map(i=>D[i]).join(',');
    if(m.end) rr+=';UNTIL='+m.end.replace(/-/g,'')+'T235959';
    const nm=(m.name+(m.dose?' ('+m.dose+')':'')).replace(/[,;\n]/g,' ');
    L.push('BEGIN:VEVENT','UID:'+m.id+'-'+t.replace(':','')+'@duzen','DTSTAMP:'+stamp,
      'DTSTART:'+m.start.replace(/-/g,'')+'T'+t.replace(':','')+'00','DURATION:PT10M','RRULE:'+rr,
      'SUMMARY:İlaç: '+nm,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:İlaç vakti','END:VALARM','END:VEVENT');
  }));
  L.push('END:VCALENDAR'); return L.join('\r\n');
}

/* ---------- arka plan bildirimi (web push) ---------- */
const PUSH_OK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&location.protocol==='https:';
const b64=u=>{const s=(u+'='.repeat((4-u.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
let evq=[];
const track=ev=>{ if(!S.settings.push) return; evq.push(ev); if(evq.length>5) evq.shift(); pushSync(); };
let syncT;
const pushSync=()=>{clearTimeout(syncT);syncT=setTimeout(doSync,800)};
async function doSync(){
  if(!S.settings.push||!PUSH_OK()) return false;
  try{
    const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription();
    if(!sub){ if(!renewing&&renewN<2&&'Notification' in window&&Notification.permission==='granted') return await renewSub(); return false; }
    const evs=evq.slice(), wantWx=wxNeed(), t=today(),y=addDays(t,-1),done=[];
    if(wantWx) wxAsked=Date.now();
    [t,y].forEach(d=>Object.keys(S.log[d]||{}).forEach(k=>done.push(d+'|'+k)));
    const r=await fetch('/api/push-sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      subscription:sub.toJSON(),name:S.settings.name||'',surname:S.settings.surname||'',shareMeds:S.settings.shareMeds===true,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
      meds:S.meds.map(m=>({id:m.id,name:m.name,dose:m.dose,times:m.times,days:m.days,start:m.start,end:m.end})),
      appts:(S.appts||[]).filter(a=>a.date>=addDays(today(),-1)).map(a=>({id:a.id,title:a.title,place:a.place||'',date:a.date,time:a.time,w1:a.w1!==false,d3:a.d3!==false,d1:!!a.d1,h2:!!a.h2})),
      evs,
      wx:wantWx,
      inbox:true,
      snz:(S.snz||[]).filter(z=>z.until>Date.now()-3600e3),
      rem:(S.reminders||[]).filter(r=>r.on).map(r=>({id:r.id,text:r.text,time:r.time,days:r.days})),done})});
    if(r.status===403){ const d=await r.json().catch(()=>({})); if(d&&d.removed){ await handleRemoved(); return 'removed'; } }
    if(r.ok){
      const d=await r.json().catch(()=>({}));
      if(d&&d.resubscribe){ wxAsked=0; return await renewSub(); }
      evq.splice(0,evs.length); if(pushIssue){ pushIssue=false; }
      if(d&&Array.isArray(d.inbox)&&d.inbox.length) inboxAdd(d.inbox);
      if(wantWx) wxApply(d);
    }
    else if(wantWx) wxAsked=0;
    return r.ok;
  }catch(e){console.error(e);wxAsked=0;return false;}
}
let renewing=false,renewN=0,pushIssue=false;
// Telefonun bildirim kaydı geçersiz olduysa kişiye bir şey sormadan yeni kayıt al (izin zaten verilmiş)
async function renewSub(){
  if(renewing||renewN>=2) return false;
  renewing=true; renewN++;
  try{
    if(!('Notification' in window)||Notification.permission!=='granted'){ pushIssue=true; return false; }
    const reg=await navigator.serviceWorker.ready;
    const old=await reg.pushManager.getSubscription(); if(old){ try{ await old.unsubscribe(); }catch(e){} }
    const {publicKey}=await (await fetch('/api/push-key')).json();
    await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(publicKey)});
    renewing=false;
    const ok=await doSync();
    pushIssue=(ok!==true&&ok!=='removed');
    if(tab==='set'||tab==='home') render();
    return ok===true;
  }catch(e){ console.error(e); pushIssue=true; if(tab==='set'||tab==='home') render(); return false; }
  finally{ renewing=false; }
}
async function handleRemoved(){
  S.settings.push=false; S.settings.shareMeds=false; evq.length=0; persist();
  try{ const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
  if(tab==='set') render();
  toast('Bildirimler duyuru gönderen kişi tarafından kapatıldı. İstersen Ayarlar\'dan tekrar açabilirsin.');
}
async function enablePush(){
  try{
    if(!PUSH_OK()) return toast('Bu açılışta arka plan bildirimi yok. Ana ekrana ekleyip oradan aç');
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){render();return toast('İzin verilmedi');}
    S.settings.notif=true;
    const reg=await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready;
    const {publicKey}=await (await fetch('/api/push-key')).json(), want=b64(publicKey);
    let sub=await reg.pushManager.getSubscription();
    if(sub){const cur=new Uint8Array(sub.options.applicationServerKey||[]); if(cur.length!==want.length||cur.some((v,i)=>v!==want[i])){await sub.unsubscribe();sub=null;}}
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:want});
    S.settings.push=true;
    const ok=await doSync(); if(ok==='removed') return;
    if(!ok){S.settings.push=false; persist(); render(); return toast('Sunucuya bağlanılamadı, tekrar dene');}
    persist(); render(); toast('Arka plan bildirimleri açıldı');
  }catch(e){console.error(e); toast('Açılamadı: '+(e.message||'hata'));}
}
async function pushUnsub(){
  try{
    const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription();
    if(sub){
      await fetch('/api/push-sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),unsubscribe:true})}).catch(()=>{});
      await sub.unsubscribe();
    }
  }catch(e){console.error(e);}
}
async function disablePush(){ await pushUnsub(); S.settings.push=false; persist(); render(); toast('Arka plan bildirimleri kapatıldı'); }

}

/* ---------- tedavi ilerlemesi ---------- */
function courseInfo(m){
  if(!m.end||!m.start) return null;
  const n=diff(m.end,m.start)+1; if(n<1||n>400) return null;
  const t=today(); let total=0,taken=0,days=0;
  for(let i=0;i<n;i++){
    const d=addDays(m.start,i); if(!medActive(m,d)) continue; days++;
    for(const tm of m.times){ total++; if(getLog(d,m.id+'|'+tm)==='taken') taken++; }
  }
  if(!total) return null;
  const per=m.times.length, used=Math.min(days,Math.floor(taken/per)), left=days-used, pct=Math.round(taken/total*100);
  let state=t<m.start?'soon':(t>m.end?'over':'run');
  if(taken>=total) state='done';
  return {total,taken,days,used,left,pct,state,missed:Math.max(0,total-taken)};
}
function courseText(ci,m){
  if(ci.state==='soon') return `${diff(m.start,today())} gün sonra başlıyor, ${ci.days} gün`;
  if(ci.state==='done') return `Tamamlandı, ${ci.days} gün`;
  if(ci.state==='over') return `Süre doldu, ${ci.missed} doz eksik kaldı`;
  return `${ci.used} gün kullandın, ${ci.left} gün kaldı`;
}
function ringSvg(ci){
  const C=2*Math.PI*19, pct=ci.state==='soon'?0:ci.pct;
  return `<svg class="mring ${ci.state}" viewBox="0 0 46 46" aria-hidden="true"><circle class="bg" cx="23" cy="23" r="19"/>${pct>0?`<circle class="fg" cx="23" cy="23" r="19" transform="rotate(-90 23 23)" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/>`:''}<text x="23" y="27">%${pct}</text></svg>`;
}
function courseLegend(ci,m){
  if(ci.state==='soon') return `<b>${courseText(ci,m)}</b>`;
  return `<span class="ok">Kullanılan: ${ci.used} gün, %${ci.pct}</span><span class="bad">Kalan: ${ci.left} gün, %${100-ci.pct}</span><span class="sub">${ci.taken}/${ci.total} doz alındı${ci.state==='over'?`, ${ci.missed} doz eksik`:''}${ci.state==='done'?', tamamlandı':''}</span>`;
}
function courseBlock(m){
  const ci=courseInfo(m); if(!ci) return '';
  return `<div class="course">${ringSvg(ci)}<div class="clg">${courseLegend(ci,m)}</div></div>`;
}

/* ---------- kaçırılan bildirimler: simge rozeti ve uygulama içi kart ---------- */
let inboxList=[];
async function inboxRead(){
  try{ const c=await caches.open('duzen-inbox'), r=await c.match('/__inbox'); return r?await r.json():{items:[],badge:0}; }
  catch(e){ return {items:[],badge:0}; }
}
async function inboxWrite(b){
  try{ const c=await caches.open('duzen-inbox'); await c.put('/__inbox',new Response(JSON.stringify(b),{headers:{'Content-Type':'application/json'}})); }catch(e){}
}
async function inboxLoad(){
  const b=await inboxRead(), now=Date.now(); let changed=false; const list=[];
  (b.items||[]).forEach(i=>{
    if(i.read) return;
    if(now-i.ts>48*3600e3){ i.read=true; changed=true; return; }
    const m=/[?&]slot=([^&]+)/.exec(i.url||'');   // dozu zaten işaretlendiyse eski ilaç bildirimi kaçırılmış sayılmaz
    if(m){ const [date,...rest]=decodeURIComponent(m[1]).split('|'); if(getLog(date,rest.join('|'))){ i.read=true; changed=true; return; } }
    list.push(i);
  });
  if(b.badge){ b.badge=0; changed=true; }          // uygulama açıldı: simgedeki rozet silinir
  if(changed) await inboxWrite(b);
  try{ if('clearAppBadge' in navigator) await navigator.clearAppBadge(); }catch(e){}
  const same=JSON.stringify(list.map(i=>i.ts))===JSON.stringify(inboxList.map(i=>i.ts));
  inboxList=list;
  const a=document.activeElement;
  if(!same&&tab==='home'&&!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))&&!$('#sheetwrap').classList.contains('open')) render();
}
async function inboxAdd(msgs){
  const b=await inboxRead(), have=new Set((b.items||[]).map(i=>i.tag));
  const add=msgs.map(m=>({ts:m.ts||Date.now(),title:m.title||'Düzen',body:m.body||'',url:m.url||'/',tag:'silent-'+(m.id||m.ts),read:false})).filter(i=>!have.has(i.tag));
  if(!add.length) return;
  b.items=[...add,...(b.items||[])].sort((x,y)=>y.ts-x.ts).slice(0,50);
  await inboxWrite(b); await inboxLoad();
}
async function inboxMark(all,ts){
  const b=await inboxRead(); (b.items||[]).forEach(i=>{ if(all||i.ts===ts) i.read=true; });
  await inboxWrite(b); await inboxLoad();
}
function inboxCard(){
  if(!inboxList.length) return '';
  const n=inboxList.length, fm=ts=>{ const d=new Date(ts); return d.toDateString()===new Date().toDateString()?`${pad(d.getHours())}:${pad(d.getMinutes())}`:`${d.getDate()} ${AYLAR[d.getMonth()]}`; };
  return `<div class="inbox"><div class="ibh"><b>${n} yeni bildirimin var</b><button class="btn ghost sm" data-a="inboxClear">Tamam</button></div>
  ${inboxList.slice(0,4).map((i,k)=>`<button class="ibi" data-a="inboxOpen" data-i="${k}"><span class="ibt">${fm(i.ts)}</span><div><b>${esc(i.title)}</b><span>${esc(i.body)}</span></div></button>`).join('')}
  ${n>4?`<div class="fine" style="margin:4px 0 4px">ve ${n-4} bildirim daha</div>`:''}</div>`;
}

/* ---------- bildirim geçmişi (zil) ---------- */
let histItems=[],histNew=new Set(),histOpen=false;
function histDay(ts){
  const d=new Date(ts),n=new Date(),yd=new Date(); yd.setDate(n.getDate()-1);
  if(d.toDateString()===n.toDateString()) return 'Bugün';
  if(d.toDateString()===yd.toDateString()) return 'Dün';
  return `${d.getDate()} ${AYLAR[d.getMonth()]} ${GUN_UZUN[d.getDay()]}`;
}
function renderHistory(){
  let last='',rows='';
  histItems.forEach((i,k)=>{
    const day=histDay(i.ts); if(day!==last){ last=day; rows+=`<div class="hd">${day}</div>`; }
    const d=new Date(i.ts);
    rows+=`<button class="hi${histNew.has(i.ts)?' new':''}" data-a="histOpen" data-i="${k}"><span class="ht">${pad(d.getHours())}:${pad(d.getMinutes())}</span><div><b>${esc(i.title)}</b><span>${esc(i.body)}</span></div></button>`;
  });
  $('#sheet').innerHTML=`<div class="grab"></div><h2>Bildirimler</h2>
  <p class="fine" style="margin-top:4px">Telefonuna gelen son bildirimler ve ne zaman geldikleri. En fazla 50 tanesi saklanır.${histNew.size?` Renkli olanlar yeni.`:''}</p>
  ${rows||'<div class="empty"><p>Henüz bildirim yok. Bundan sonra gelen bildirimler burada listelenir.</p></div>'}
  <div class="actions">${histItems.length?`<button class="btn danger" data-a="inboxWipe">${delArm==='inbox'?'Emin misin?':'Geçmişi temizle'}</button>`:''}<button class="btn teal" data-a="closeSheet">Kapat</button></div>`;
}
async function openHistory(){
  const b=await inboxRead();
  histItems=(b.items||[]).slice().sort((x,y)=>y.ts-x.ts);
  histNew=new Set(histItems.filter(i=>!i.read).map(i=>i.ts));
  delArm=''; histOpen=true; renderHistory(); $('#sheetwrap').classList.add('open');
  if(histNew.size||b.badge){ (b.items||[]).forEach(i=>{ i.read=true; }); b.badge=0; await inboxWrite(b); }
  try{ if('clearAppBadge' in navigator) await navigator.clearAppBadge(); }catch(e){}
  inboxList=[];
}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='sheetwrap'){closeSheet();return;}
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a,D=el.dataset,t=today();
  switch(a){
    case 'tab': tab=D.t; delArm=''; render(); $('#main').scrollTop=0; if(tab==='set'){ loadAssigned(); peekContact(); } break;
    case 'take': case 'skip': {
      const s=slotsFor(t).find(x=>x.key===D.k); if(s){setLog(t,s.key,a==='take'?'taken':'skipped',s.m); render();} break; }
    case 'undo': { const s=slotsFor(t).find(x=>x.key===D.k); if(s){setLog(t,s.key,null,s.m); render();} break; }
    case 'aTake': case 'aSkip': { const s=alertOpen; if(s){setLog(t,s.key,a==='aTake'?'taken':'skipped',s.m);} closeAlert(); break; }
    case 'aSnooze': { const s=alertOpen; if(s){const until=Date.now()+10*60000; snooze[s.key]=until; delete fired[t+s.key]; S.snz=(S.snz||[]).filter(z=>z.until>Date.now()-3600e3).concat({slot:t+'|'+s.key,until}); persist();} closeAlert(); toast('10 dakika sonra tekrar hatırlatacağım'); break; }

    case 'newMed': draft={id:null,name:'',dose:'',times:['08:00'],days:[0,1,2,3,4,5,6],start:t,end:'',courseN:'',stock:'',note:''}; openSheet(); break;
    case 'editMed': { const m=S.meds.find(x=>x.id===D.id); draft={...m,times:[...m.times],days:[...m.days],courseN:(m.end&&m.start&&m.end>=m.start)?String(diff(m.end,m.start)+1):''}; delArm=''; openSheet(); break; }
    case 'closeSheet': closeSheet(); break;
    case 'addPreset': { const p=REM_PRESETS[+D.i]; (S.reminders=S.reminders||[]).push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:p.text,time:p.time,days:[0,1,2,3,4,5,6],on:true}); persist(); render(); toast('Hatırlatıcı eklendi'); break; }
    case 'newRem': rdraft={id:null,text:'',time:'13:00',days:[0,1,2,3,4,5,6],on:true}; delArm=''; openRem(); break;
    case 'editRem': { const r=(S.reminders||[]).find(x=>x.id===D.id); if(!r) break; rdraft={...r,days:[...r.days]}; delArm=''; openRem(); break; }
    case 'togRemDay': { syncR(); const i=+D.i,k=rdraft.days.indexOf(i); k>=0?rdraft.days.splice(k,1):rdraft.days.push(i); openRem(); break; }
    case 'saveRem': saveRem(); break;
    case 'delRem':
      if(delArm!=='rem'){syncR(); delArm='rem'; openRem();}
      else{ S.reminders=(S.reminders||[]).filter(x=>x.id!==rdraft.id); persist(); closeSheet(); render(); toast('Hatırlatıcı silindi'); }
      break;
    case 'togRem': { const r=(S.reminders||[]).find(x=>x.id===D.id); if(r){r.on=!r.on; persist(); render();} break; }
    case 'togAsg': {
      const r=assignedCache.find(x=>x.id===D.id); if(!r) break;
      r.off=!r.off; render();
      assignedCall({id:r.id,off:r.off}).then(d=>{ if(d){assignedCache=d.items||[]; if(d.weather) weatherCache=d.weather; if(tab==='set') render();} else toast('Kaydedilemedi, tekrar dene'); });
      break; }
    case 'togWeather': {
      weatherCache.off=!weatherCache.off; render();
      assignedCall({weatherOff:weatherCache.off}).then(d=>{ if(d){ if(d.weather) weatherCache=d.weather; if(tab==='set') render(); } else toast('Kaydedilemedi, tekrar dene'); });
      break; }
    case 'newAppt': adraft={id:null,title:'',date:t,time:'09:00',place:'',w1:true,d3:true,d1:true,h2:false}; delArm=''; openAppt(); break;
    case 'editAppt': { const a=(S.appts||[]).find(x=>x.id===D.id); if(!a) break; adraft={...a,w1:a.w1!==false,d3:a.d3!==false}; delArm=''; openAppt(); break; }
    case 'aptTog': syncAppt(); adraft[D.k]=!adraft[D.k]; openAppt(); break;
    case 'saveAppt': saveAppt(); break;
    case 'delAppt':
      if(delArm!=='appt'){syncAppt(); delArm='appt'; openAppt();}
      else{ S.appts=(S.appts||[]).filter(x=>x.id!==adraft.id); persist(); closeSheet(); render(); toast('Randevu silindi'); }
      break;
    case 'theme': S.settings.theme=D.v; persist(); applyTheme(); render(); break;
    case 'inboxHist': openHistory(); break;
    case 'histOpen': { const i=histItems[+D.i]; if(i&&i.url&&i.url!=='/'){ const u=i.url; closeSheet(); handleNav(u); } break; }
    case 'inboxWipe':
      if(delArm!=='inbox'){ delArm='inbox'; renderHistory(); }
      else{ (async()=>{ const b=await inboxRead(); b.items=[]; b.badge=0; await inboxWrite(b); histItems=[]; histNew=new Set(); inboxList=[]; delArm=''; renderHistory(); toast('Geçmiş temizlendi'); })(); }
      break;
    case 'wxDay': wxSel=(wxSel===+D.i?-1:+D.i); render(); break;
    case 'inboxClear': inboxMark(true); break;
    case 'inboxOpen': { const i=inboxList[+D.i]; if(i){ const u=i.url; inboxMark(false,i.ts).then(()=>handleNav(u)); } break; }
    case 'aClose': closeAlert(); break;
    case 'openContact': openContact(); break;
    case 'cSend': sendContact(); break;
    case 'nameSave': saveName(); break;
    case 'nameSkip': closeSheet(); break;
    case 'addTime': syncDraft(); draft.times.push('12:00'); openSheet(); break;
    case 'delTime': syncDraft(); draft.times.splice(+D.i,1); openSheet(); break;
    case 'togDay': { syncDraft(); const i=+D.i,k=draft.days.indexOf(i); k>=0?draft.days.splice(k,1):draft.days.push(i); openSheet(); break; }
    case 'saveMed': saveMed(); break;
    case 'delMed':
      if(delArm!=='med'){syncDraft(); delArm='med'; openSheet();}
      else{ S.meds=S.meds.filter(m=>m.id!==draft.id); persist(); closeSheet(); render(); toast('İlaç silindi'); }
      break;
    case 'ics': download('duzen-ilac-alarmlari.ics',makeICS(),'text/calendar'); break;

    case 'startToday': startPeriod(t); selDay=t; render(); toast('Regl başlangıcı kaydedildi'); break;
    case 'contYes': S.periodDays[t]=true; persist(); render(); break;
    case 'contNo': S.dismissed=t; persist(); render(); break;
    case 'onb': { const v=$('#onb').value; if(!v||v>t) return toast('Geçerli bir tarih seç'); startPeriod(v); calMonth=parse(v); calMonth.setDate(1); render(); toast('Kaydedildi, tahminler hazır'); break; }
    case 'pick': selDay=D.d; render(); break;
    case 'mprev': calMonth.setMonth(calMonth.getMonth()-1); render(); break;
    case 'mnext': calMonth.setMonth(calMonth.getMonth()+1); render(); break;
    case 'togP': { if(S.periodDays[selDay]) delete S.periodDays[selDay]; else S.periodDays[selDay]=true; persist(); render(); break; }
    case 'flow': { const o=S.day[selDay]=S.day[selDay]||{}; o.flow=o.flow===D.v?'':D.v; persist(); render(); break; }
    case 'sym': { const o=S.day[selDay]=S.day[selDay]||{}; o.sym=o.sym||[]; const k=o.sym.indexOf(D.v); k>=0?o.sym.splice(k,1):o.sym.push(D.v); persist(); render(); break; }

    case 'step': { const k=D.k,lim=k==='cycleLen'?[20,45]:[2,10]; S.settings[k]=Math.min(lim[1],Math.max(lim[0],S.settings[k]+ +D.v)); if(k==='cycleLen') S.settings.auto=false; persist(); render(); break; }
    case 'tgl': S.settings[D.k]=!S.settings[D.k]; persist(); render(); break;
    case 'pushOn': enablePush(); break;
    case 'pushOff': disablePush(); break;
    case 'testNotif': testNotif(); break;
    case 'export': download('duzen-yedek-'+t+'.json',JSON.stringify(S,null,1),'application/json'); break;
    case 'reset':
      if(delArm!=='reset'){delArm='reset'; render();}
      else{ if(S.settings.push) pushUnsub(); S={meds:[],log:{},periodDays:{},day:{},dismissed:'',settings:{name:'',cycleLen:28,periodLen:5,auto:true,sound:true,notif:false}}; delArm=''; persist(); render(); toast('Tüm veriler silindi'); }
      break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='th-from'||el.id==='th-to'){ if(el.value){ S.settings[el.id==='th-from'?'themeFrom':'themeTo']=el.value; persist(); applyTheme(); render(); } }
  else if(el.id==='note'){ const o=S.day[selDay]=S.day[selDay]||{}; o.note=el.value; persist(); }
  else if(el.id==='nm'){ S.settings.name=el.value.trim(); persist(); }
  else if(el.id==='sn'){ S.settings.surname=el.value.trim().slice(0,40); persist(); }
  else if(el.id==='import'&&el.files[0]){
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.meds)) throw 0; S={...S,...d,settings:{...S.settings,...(d.settings||{})}}; persist(); render(); toast('Yedek yüklendi'); }catch(err){ toast('Dosya okunamadı'); } };
    r.readAsText(el.files[0]);
  }
});
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ hiddenAt=Date.now(); return; } inboxLoad(); tick(); if(S.settings.push){ if(hiddenAt&&Date.now()-hiddenAt>300000) track({type:'open'}); else pushSync(); } });

/* ---------- başlat ---------- */
(async function init(){
  const d=await store.load();
  if(d) S={...S,...d,settings:{...S.settings,...(d.settings||{})}};
  if((S.appts||[]).some(a=>a.date<addDays(today(),-90))){ S.appts=S.appts.filter(a=>a.date>=addDays(today(),-90)); persist(); }
  applyTheme(); try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(S.settings.theme==='system') applyTheme(); }); }catch(e){}
  wxLoadCache(); render(); tick(); setInterval(tick,15000); inboxLoad(); setTimeout(maybeAskName,700);
  if('serviceWorker' in navigator&&location.protocol==='https:'){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); if(S.settings.push) pushSync();
    navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='nav') handleNav(e.data.url); else if(e.data&&e.data.type==='resub') renewSub(); else if(e.data&&e.data.type==='inbox') inboxLoad(); });
  }
  if(location.search){ const q=location.search; try{history.replaceState(null,'',location.pathname);}catch(e){} setTimeout(()=>handleNav(q),300); }
  else track({type:'open'});
})();
</script>
